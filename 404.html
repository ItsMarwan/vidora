<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <script>
        (function () {
            const path =
                location.pathname +
                location.search +
                location.hash;

            sessionStorage.setItem("vidora_redirect_path", path);

            location.replace("/");
        })();
    </script>

    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #09090b;
            color: #e8b84b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Manrope, sans-serif;
        }
    </style>
</head>
    <body>
        Redirecting...
    </body>
</html>
