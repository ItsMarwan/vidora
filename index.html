<body>
<a href="#app" class="skip-link">Skip to content</a>

<header class="navbar">
  <div class="navbar-inner">
    <a href="/" class="brand">Vid<span class="dot">ora</span></a>
    <nav aria-label="Primary">
      <ul class="nav-links" id="navLinks">
        <li><a href="/" data-route="home">Home</a></li>
        <li><a href="/movies" data-route="movies">Movies</a></li>
        <li><a href="/series" data-route="series">Series</a></li>
        <li><a href="/list" data-route="list">My List</a></li>
      </ul>
    </nav>
    <div class="nav-search" id="navSearch" role="search">
      <label for="searchInput" class="sr-only">Search movies &amp; series</label>
      <span class="nav-search-icon" data-icon="search" data-icon-size="16" aria-hidden="true"></span>
      <input type="search" id="searchInput" placeholder="Search movies &amp; series…" enterkeyhint="search" />
    </div>
    <button type="button" class="nav-icon-btn" id="navSurprise" title="Surprise me" aria-label="Surprise me — pick something random to watch">
      <span data-icon="dice" data-icon-size="18" aria-hidden="true"></span>
    </button>
    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
      <span class="nav-toggle-bar" aria-hidden="true"></span>
    </button>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="mobile-menu-glow" aria-hidden="true"></div>
  <div class="mobile-menu-top">
    <a href="/" class="brand">Vid<span class="dot">ora</span></a>
    <button type="button" class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">
      <span data-icon="close" data-icon-size="20" aria-hidden="true"></span>
    </button>
  </div>

  <div class="mobile-menu-search" role="search">
    <label for="mobileSearchInput" class="sr-only">Search movies &amp; series</label>
    <span class="nav-search-icon" data-icon="search" data-icon-size="17" aria-hidden="true"></span>
    <input type="search" id="mobileSearchInput" placeholder="Search movies &amp; series…" enterkeyhint="search" />
  </div>

  <nav aria-label="Mobile" class="mobile-menu-links">
    <a href="/" data-route="home" class="mobile-menu-link" style="--i:0">
      <span class="mobile-menu-link-icon" data-icon="home" data-icon-size="21" aria-hidden="true"></span>
      <span class="mobile-menu-link-label">Home</span>
      <span class="mobile-menu-link-chevron" data-icon="chevronRight" data-icon-size="16" aria-hidden="true"></span>
    </a>
    <a href="/movies" data-route="movies" class="mobile-menu-link" style="--i:1">
      <span class="mobile-menu-link-icon" data-icon="film" data-icon-size="21" aria-hidden="true"></span>
      <span class="mobile-menu-link-label">Movies</span>
      <span class="mobile-menu-link-chevron" data-icon="chevronRight" data-icon-size="16" aria-hidden="true"></span>
    </a>
    <a href="/series" data-route="series" class="mobile-menu-link" style="--i:2">
      <span class="mobile-menu-link-icon" data-icon="tv" data-icon-size="21" aria-hidden="true"></span>
      <span class="mobile-menu-link-label">Series</span>
      <span class="mobile-menu-link-chevron" data-icon="chevronRight" data-icon-size="16" aria-hidden="true"></span>
    </a>
    <a href="/list" data-route="list" class="mobile-menu-link" style="--i:3">
      <span class="mobile-menu-link-icon" data-icon="heart" data-icon-size="21" aria-hidden="true"></span>
      <span class="mobile-menu-link-label">My List</span>
      <span class="mobile-menu-link-chevron" data-icon="chevronRight" data-icon-size="16" aria-hidden="true"></span>
    </a>
  </nav>

  <button type="button" class="btn btn-primary mobile-menu-surprise" id="mobileSurprise" style="--i:4">
    <span data-icon="dice" data-icon-size="18" aria-hidden="true"></span> Surprise Me
  </button>
</div>

<main id="app" tabindex="-1"></main>

<footer class="footer">
  Vidora · playback powered by the Vidking embed API
</footer>

<script src="js/hash-redirect.js"></script>

<script src="js/components.js"></script>
<script src="js/party.js"></script>
<script src="js/party-ui.js"></script>
<script src="js/app.js"></script>

</html>
